<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/product.css" />
  </head>
  <body>
    <div class="product-card">
      <div class="product-card-top">
        <div class="img">
          <img src="./images/adidas-sneaker.png" alt="Adidas Sneaker Image" />
        </div>
        <i class="fa-solid fa-database"></i>
        <div class="colors">
          <div class="color"></div>
          <div class="color"></div>
          <div class="color"></div>
          <div class="color"></div>
        </div>
      </div>
      <div class="product-card-details">
        <h3 class="info">
          <span>Title</span>
          <span>$299.99</span>
        </h3>
        <div class="size-guide">
          <h3>Select size</h3>
          <span>
            <a href="">Size guide</a>
          </span>
        </div>
        <div class="sizes">
          <div>40</div>
          <div>42</div>
          <div>44</div>
          <div>46</div>
          <div>48</div>
        </div>
        <button>Add to cart</button>
      </div>
    </div>
  </body>
</html>
