<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
  </head>
  <body>
    <script>
      // print functions/methods
      document.write("Hello World");
      document.write("<h1>Hello World</h1>");

      console.log("Hello World");

      //   alert("Hello world");

      // input function
      //   prompt("Enter something");

      // variables: that holds value, can be regarded as a container, location. etc.
      // variable declaration: we use keywords using let and const
      // example of variable declaration
      let a;
      console.log(a);

      // variable declaration with initialization
      let b = 5;
      console.log(b);

      // resassign
      b = "some text";
      console.log(b);

      // data types: string, number, object, undefined, null, boolean
      // string: we can declare string with '', "", ``
      let string1 = "String\n 1";
      let string2 = 'String 2';
      let string3 = `String 
                    3, and let's
                    continue`;
                    console.log(string1, string2, string3);

    // with backticks, this is template literal
    let num = 3;
    console.log(`The number is ${num}, and when you multiply it with 2 is ${num * 2}`);

    // camel casing: full name => fullName, full name and last name => fullNameAndLastName
    // snake casing => full_name
    // JS best practice is camel casing
    const firstName = "John";

    // we can check types of data using the keyword: typeof
    console.log("Type of firstName", typeof firstName);

    // number: whole number, decimals
    console.log(3);
    let num2 = 6;
    console.log("Num2: " + num2);
    let num3 = 7.5
    console.log("Num3:", num3);
    console.log(typeof num3);

    // boolean: true and false
    const isValid = true;
    console.log("IsValid:", isValid);
    console.log(typeof isValid);

    // objects: array, object, null
    // array: [], object {}
    // example:
    const array = [];
    const object = {};

    console.log(typeof array);
    console.log(typeof object);
    console.log(typeof null);

    // undefined 
    console.log(typeof undefined);

    // arithmetic operators: +, -, *, /, **, %, ++, --
    console.log("====== Operators ======");
    console.log(4 + 5);
    console.log(5 - 5);
    console.log(3 * 3);
    console.log(10 / 5);
    console.log(3 ** 3);
    console.log(10 % 3);

    let num5 = 0;
    console.log(num5);
    num5++;
    console.log(num5);

    num--;
    console.log(num5);

    ++num5;
    console.log(num5);

    --num5;
    console.log(num5);

    // let keyword, the variables can be re-assigned
    // const keyword, the variables cannot be re-assigned
    // both let and const keyword variables are block scoped
    let letVariable = "let variable"; 
    letVariable = 10; 

    const constVariable = "const variable";
    // constVariable = 11;
     // this is not allowed with variables initialized with const keyword

    console.log("After const reassignment");

    // block scope example
    
    {
        var varVariable = 15;
    }

    console.log("Var variable", varVariable);

    {
        let blockedScoped = 11;
    }

    // uncomment next line when revising
    // console.log(blockedScoped);

    // other operators: logical and comparision
    // comparision: >, <, >=, <=, ==, !=, ===, !===
    const comparision1 = 3 > 5;
    console.log(comparision1);
    console.log(3 < 5);
    console.log(5 >= 5);
    console.log(5 <= 5);

    const num6 = 6;
    const num7 = 7;
    const num10 = 10;
    const num11 = "10";

    console.log(num6 == num7); // false
    console.log(num6 != num7); // true

    console.log("equals to and not equals to")
    console.log(num10 == num11);
    console.log(num10 === num11);
    console.log(num10 != num11);
    console.log(num10 !== num11);

    // let num8;
    // const variables must be initialized
    // const num9;

    // logical operators: ! => not, && => and, || => or
    console.log("Logical operators");
    console.log(!true);
    console.log(true && false);
    console.log(true && true);
    console.log(true || false);




      
    </script>
  </body>
</html>
